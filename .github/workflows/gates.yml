name: gates

# Trunk-based CI: every push to main gets one verdict. The weekly run
# catches drift in what the lockfile does not pin (runner image, registry).

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

# A newer push re-checks the whole tree, so an older run on the same ref may stop.
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A real Postgres for the Bun.sql driver tests.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s
          --health-timeout 5s --health-retries 20
    env:
      PG_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      # Typecheck, tests, and the build with its client check.
      - run: bun run check
      # Format and lint (vp check).
      - run: bun run check:style
      # No plain helper functions: every named function is an operation.
      - run: bun run check:plain
