name: tinker-start-victoria

services:
  traces:
    image: victoriametrics/victoria-traces:v0.12.0
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=7d
    ports:
      - "127.0.0.1:10428:10428"
    volumes:
      - traces:/storage
  logs:
    image: victoriametrics/victoria-logs:v1.53.0
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=7d
    ports:
      - "127.0.0.1:9428:9428"
    volumes:
      - logs:/storage

volumes:
  traces:
  logs:
