packages:
  - apps/*
  - packages/*

catalogMode: prefer

# Only the entries Start, the scaffold, and start-min use. Keep "catalog:" first and
# "overrides:" right after it: apps/start-scaffold/maintain/registry-source.mjs reads this block.
catalog:
  "@electric-sql/pglite": ^0.5.8
  '@radix-ui/react-slot': 1.3.3
  "@stryker-mutator/core": ^10.0.0
  "@stryker-mutator/vitest-runner": ^10.0.0
  '@tailwindcss/vite': 4.3.3
  '@tanstack/react-router': 1.170.41
  '@tanstack/react-start': 1.168.60
  '@tinker/core': https://github.com/lagz0ne/tinkered/releases/download/start-v0.8.0/tinker-core-0.8.0.tgz
  '@tinker/react': https://github.com/lagz0ne/tinkered/releases/download/start-v0.8.0/tinker-react-0.8.0.tgz
  "@types/node": ^24
  '@types/nodemailer': ^7.0.12
  '@types/pg': ^8.23.1
  better-auth: 1.7.7
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  drizzle-kit: 1.0.0-rc.4
  drizzle-orm: 1.0.0-rc.4
  fractional-indexing: ^4.0.0
  nodemailer: 10.0.13
  oxc-parser: ^0.117.0
  pg: 8.20.0
  react: ^19.3.0
  react-dom: ^19.3.0
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.3
  typescript: ^7.0.2
  typescript-api: npm:typescript@5.9.3
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  vitest: 5.0.1
  zod: ^4.0.0
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  esbuild: true
# @tinker/react's release tarball names @tinker/core by its release URL, the same URL
# the packages here name. pnpm 12 blocks URL specs inside dependencies unless this is off.
blockExoticSubdeps: false
